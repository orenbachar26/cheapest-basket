name: update-data
on:
  workflow_dispatch:
  push:
    paths: ['tools/build_data.py', '.github/workflows/update-data.yml']
  schedule:
    - cron: '30 0 * * *'   # every night ~02:30 Israel time
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tools/build_data.py
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Nightly price data update"
          git pull --rebase -q || true
          git push
